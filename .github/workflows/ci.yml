name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MOSQUITTO_VERSION: v2.1.4

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  differential:
    # Runs the #[ignore]d differential tests against real Mosquitto builds;
    # see docs/testing.md#differential-tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Mosquitto reference builds
        id: mosquitto-cache
        uses: actions/cache@v6
        with:
          path: |
            /tmp/cjson-install
            /tmp/mosquitto
          key: mosquitto-${{ env.MOSQUITTO_VERSION }}-${{ runner.os }}-v3
      - name: Install build and runtime packages
        # The HTTP API reference links libmicrohttpd dynamically, so it is needed on cache hits too.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libssl-dev libmicrohttpd-dev
      - name: Build Mosquitto references
        if: steps.mosquitto-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone --depth 1 https://github.com/DaveGamble/cJSON.git /tmp/cJSON
          cmake -S /tmp/cJSON -B /tmp/cJSON/build -DCMAKE_INSTALL_PREFIX=/tmp/cjson-install \
            -DENABLE_CJSON_TEST=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/cJSON/build -j"$(nproc)" && cmake --install /tmp/cJSON/build
          git clone --depth 1 -b "$MOSQUITTO_VERSION" https://github.com/eclipse-mosquitto/mosquitto.git /tmp/mosquitto
          common="-DCMAKE_PREFIX_PATH=/tmp/cjson-install -DWITH_DOCS=OFF -DWITH_TESTS=OFF -DWITH_PLUGINS=OFF -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release"
          cmake -S /tmp/mosquitto -B /tmp/mosquitto/build $common -DWITH_WEBSOCKETS=OFF
          cmake --build /tmp/mosquitto/build -j"$(nproc)"
          cmake -S /tmp/mosquitto -B /tmp/mosquitto/build-ws $common -DWITH_WEBSOCKETS=ON -DWITH_WEBSOCKETS_BUILTIN=ON
          cmake --build /tmp/mosquitto/build-ws -j"$(nproc)"
          cmake -S /tmp/mosquitto -B /tmp/mosquitto/build-http -DCMAKE_PREFIX_PATH=/tmp/cjson-install \
            -DWITH_HTTP_API=ON -DHTTP_API_DIR=/tmp/mosquitto/www -DWITH_DOCS=OFF -DWITH_TESTS=OFF \
            -DWITH_PLUGIN_PERSIST_SQLITE=OFF -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mosquitto/build-http -j"$(nproc)"
          cmake -S /tmp/mosquitto -B /tmp/mosquitto/build-plugins -DCMAKE_PREFIX_PATH=/tmp/cjson-install \
            -DWITH_PLUGINS=ON -DWITH_PLUGIN_PERSIST_SQLITE=OFF -DWITH_WEBSOCKETS=OFF -DWITH_DOCS=OFF -DWITH_TESTS=OFF \
            -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mosquitto/build-plugins -j"$(nproc)"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install client SDKs for interoperability tests
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r crates/mqx-difftest/tests/clients/requirements.txt
          npm ci --prefix crates/mqx-difftest/tests/clients --ignore-scripts --no-audit --no-fund
      - run: cargo build --locked -p mqx-server
      - name: Differential and failover tests
        env:
          MOSQUITTO_BUILD_DIR: /tmp/mosquitto/build
          MOSQUITTO_WS_BUILD_DIR: /tmp/mosquitto/build-ws
          MOSQUITTO_HTTP_BUILD_DIR: /tmp/mosquitto/build-http
          MOSQUITTO_PLUGIN_BUILD_DIR: /tmp/mosquitto/build-plugins
          MQEXTENDED_BIN: ${{ github.workspace }}/target/debug/mqextended
        # mqx-bench's ignored test needs release builds; run it locally.
        run: cargo test --locked --workspace --exclude mqx-bench --all-features -- --ignored

  linux-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify staged release, sample configuration and unit
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/mqx-bundle"
          ./scripts/stage-linux.sh "$bundle"
          (cd "$bundle" && sha256sum --check --strict SHA256SUMS)
          "$bundle/bin/mqextended" --version
          "$bundle/bin/mqextended" --test-config -c "$bundle/etc/mqextended.conf"
          sed "s|^ExecStart=.*|ExecStart=\"$bundle/bin/mqextended\" -c \"$bundle/etc/mqextended.conf\"|" \
            "$bundle/lib/systemd/system/mqextended.service" > "$RUNNER_TEMP/mqx-check.service"
          systemd-analyze verify "$RUNNER_TEMP/mqx-check.service"

  root-process:
    # Only a trusted revision may run a repository-built binary as root.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run the root process smoke
        shell: bash
        run: |
          test_name=root_only_identity_mapping_and_privilege_drop_order
          test_bin="$(
            cargo test --locked -p mqx-server --test process --no-run --message-format=json |
              jq -er 'select(.reason == "compiler-artifact" and .target.name == "process" and (.target.kind | index("test")) and .executable != null) | .executable'
          )"
          "$test_bin" --exact "$test_name" --list | grep -Fx "$test_name: test"
          sudo -- /usr/bin/env -i MQX_ROOT_PROCESS_SMOKE=1 \
            /usr/bin/timeout --kill-after=5s 90s \
            /usr/bin/unshare --fork --pid --mount-proc --kill-child -- \
            "$test_bin" --exact "$test_name"
