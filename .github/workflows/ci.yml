name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MOSQUITTO_VERSION: v2.1.4

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  differential:
    # Runs the #[ignore]d differential tests against real Mosquitto builds;
    # see docs/testing.md#differential-tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure reference build paths
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "MOSQUITTO_SRC=$RUNNER_TEMP/mosquitto"
            echo "MOSQUITTO_BUILD_DIR=$RUNNER_TEMP/mosquitto/build"
            echo "MOSQUITTO_CJSON_INCLUDE=$RUNNER_TEMP/cjson-install/include"
            echo "MQEXTENDED_BIN=$GITHUB_WORKSPACE/target/debug/mqextended"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Mosquitto reference builds
        id: mosquitto-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/cjson-install
            ${{ runner.temp }}/mosquitto
          key: mosquitto-${{ env.MOSQUITTO_VERSION }}-${{ runner.os }}-v4
      - name: Install build and runtime packages
        # The HTTP API reference links libmicrohttpd dynamically, so it is needed on cache hits too.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake git patch libssl-dev libmicrohttpd-dev
      - name: Build Mosquitto references
        if: steps.mosquitto-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          cjson="$RUNNER_TEMP/cJSON"
          cjson_install="$RUNNER_TEMP/cjson-install"
          git clone --depth 1 https://github.com/DaveGamble/cJSON.git "$cjson"
          cmake -S "$cjson" -B "$cjson/build" -DCMAKE_INSTALL_PREFIX="$cjson_install" \
            -DENABLE_CJSON_TEST=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "$cjson/build" -j"$(nproc)" && cmake --install "$cjson/build"
          git clone --depth 1 -b "$MOSQUITTO_VERSION" https://github.com/eclipse-mosquitto/mosquitto.git "$MOSQUITTO_SRC"
          common=(-DCMAKE_PREFIX_PATH="$cjson_install" -DWITH_DOCS=OFF -DWITH_TESTS=OFF -DWITH_PLUGINS=OFF -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release)
          cmake -S "$MOSQUITTO_SRC" -B "$MOSQUITTO_BUILD_DIR" "${common[@]}" -DWITH_WEBSOCKETS=OFF
          cmake --build "$MOSQUITTO_BUILD_DIR" -j"$(nproc)"
          cmake -S "$MOSQUITTO_SRC" -B "$MOSQUITTO_SRC/build-ws" "${common[@]}" -DWITH_WEBSOCKETS=ON -DWITH_WEBSOCKETS_BUILTIN=ON
          cmake --build "$MOSQUITTO_SRC/build-ws" -j"$(nproc)"
          cmake -S "$MOSQUITTO_SRC" -B "$MOSQUITTO_SRC/build-http" -DCMAKE_PREFIX_PATH="$cjson_install" \
            -DWITH_HTTP_API=ON -DHTTP_API_DIR="$MOSQUITTO_SRC/www" -DWITH_DOCS=OFF -DWITH_TESTS=OFF \
            -DWITH_PLUGIN_PERSIST_SQLITE=OFF -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$MOSQUITTO_SRC/build-http" -j"$(nproc)"
          cmake -S "$MOSQUITTO_SRC" -B "$MOSQUITTO_SRC/build-plugins" -DCMAKE_PREFIX_PATH="$cjson_install" \
            -DWITH_PLUGINS=ON -DWITH_PLUGIN_PERSIST_SQLITE=OFF -DWITH_WEBSOCKETS=OFF -DWITH_DOCS=OFF -DWITH_TESTS=OFF \
            -DWITH_LIB_CPP=OFF -DWITH_CTRL_SHELL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$MOSQUITTO_SRC/build-plugins" -j"$(nproc)"
      - name: Build auth-plug reference and unpack backend servers
        run: bash scripts/auth-plug-reference.sh "$RUNNER_TEMP/auth-plug-reference" > "$RUNNER_TEMP/auth-plug.env"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'
          cache: false
      - name: Build go-auth reference
        run: bash scripts/go-auth-reference.sh "$RUNNER_TEMP/go-auth-reference" > "$RUNNER_TEMP/go-auth.env"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install client SDKs for interoperability tests
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r crates/mqx-difftest/tests/clients/requirements.txt
          npm ci --prefix crates/mqx-difftest/tests/clients --ignore-scripts --no-audit --no-fund
      - run: cargo build --locked -p mqx-server --all-features
      - name: Differential and failover tests
        env:
          MOSQUITTO_WS_BUILD_DIR: ${{ runner.temp }}/mosquitto/build-ws
          MOSQUITTO_HTTP_BUILD_DIR: ${{ runner.temp }}/mosquitto/build-http
          MOSQUITTO_PLUGIN_BUILD_DIR: ${{ runner.temp }}/mosquitto/build-plugins
        # mqx-bench needs release builds; the auth plugins use separate environments below.
        run: >-
          cargo test --locked --workspace --exclude mqx-bench --exclude mqx-extauth --all-features -- --ignored --skip auth_plug:: --skip go_auth::
      - name: Auth-plug differential tests
        run: |
          source "$RUNNER_TEMP/go-auth.env" # Provides MONGOD for database_reference.
          source "$RUNNER_TEMP/auth-plug.env"
          cargo test --locked -p mqx-difftest --test auth_plug -- --ignored mosquitto_self
          cargo test --locked -p mqx-difftest --test auth_plug -- --ignored --skip mosquitto_self
          cargo test --locked -p mqx-extauth --test auth_plug_reference --test database_reference -- --ignored
      - name: Go-auth differential tests
        run: |
          source "$RUNNER_TEMP/auth-plug.env"
          source "$RUNNER_TEMP/go-auth.env"
          cargo test --locked -p mqx-difftest --test go_auth -- --ignored mosquitto_self
          cargo test --locked -p mqx-difftest --test go_auth -- --ignored --skip mosquitto_self
          cargo test --locked -p mqx-extauth --test goauth_http --test goauth_databases -- --ignored

  linux-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify staged release, sample configuration and unit
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/mqx-bundle"
          ./scripts/stage-linux.sh "$bundle"
          (cd "$bundle" && sha256sum --check --strict SHA256SUMS)
          "$bundle/bin/mqextended" --version
          "$bundle/bin/mqextended" --test-config -c "$bundle/etc/mqextended.conf"
          sed "s|^ExecStart=.*|ExecStart=\"$bundle/bin/mqextended\" -c \"$bundle/etc/mqextended.conf\"|" \
            "$bundle/lib/systemd/system/mqextended.service" > "$RUNNER_TEMP/mqx-check.service"
          systemd-analyze verify "$RUNNER_TEMP/mqx-check.service"
      - name: Retain the verified release for same-host broker comparisons
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mqextended-linux-${{ github.sha }}
          path: ${{ runner.temp }}/mqx-bundle/
          if-no-files-found: error
          retention-days: 3
      - name: Build the matching load generator without adding it to the broker package
        if: github.event_name == 'push'
        run: |
          host=$(rustc -vV | awk '$1 == "host:" { print $2 }')
          cargo build --locked --release --target "$host" -p mqx-bench --bin mqx-bench
          out="$RUNNER_TEMP/mqx-bench"
          install -Dm755 "target/$host/release/mqx-bench" "$out/mqx-bench"
          (cd "$out" && sha256sum mqx-bench > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: mqx-bench-linux-${{ github.sha }}
          path: ${{ runner.temp }}/mqx-bench/
          if-no-files-found: error
          retention-days: 3

  root-process:
    # Only a trusted revision may run a repository-built binary as root.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run the root process smoke
        shell: bash
        run: |
          test_name=root_only_identity_mapping_and_privilege_drop_order
          test_bin="$(
            cargo test --locked -p mqx-server --test process --no-run --message-format=json |
              jq -er 'select(.reason == "compiler-artifact" and .target.name == "process" and (.target.kind | index("test")) and .executable != null) | .executable'
          )"
          "$test_bin" --exact "$test_name" --list | grep -Fx "$test_name: test"
          sudo -- /usr/bin/env -i MQX_ROOT_PROCESS_SMOKE=1 \
            /usr/bin/timeout --kill-after=5s 90s \
            /usr/bin/unshare --fork --pid --mount-proc --kill-child -- \
            "$test_bin" --exact "$test_name"
