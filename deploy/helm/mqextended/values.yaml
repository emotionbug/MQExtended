# Three workers, one voting broker and PVC per worker. Set 1 for a single worker.
replicaCount: 3
additionalVoter:
  # Valid with replicaCount: 2. Adds a full voter without a client endpoint.
  enabled: false
autoRecover:
  # Keep serving without quorum and rejoin without an operator. Writes that
  # only reached a discarded branch are lost. Set false to wait for quorum.
  enabled: true
rollout:
  # Let each voter replace its own outdated Pod when every voter is healthy.
  automatic: true
qos1ReplayBatch:
  # Set only after every voter and learner can replay the new WAL command.
  enabled: false
# Disable Nagle on accepted TCP connections. Small frames may use more packets.
setTcpNoDelay: false
# Broker options for the global section of mosquitto.conf, overriding the
# broker's defaults. Example: {persistent_client_expiration: never,
# max_queued_bytes: 0, retain_max_age: never} restores Mosquitto's behaviour
# for sessions, queues and retained messages without an expiry.
brokerOptions: {}

image:
  repository: ""
  tag: ""

storage:
  # Null uses the default StorageClass; "" requests a volume with no class.
  storageClassName: null
  size: 10Gi

# Client listeners, each on the client Service and every client-facing Pod.
# Enable the ones your existing clients use. Ports 7000 and 9883 are reserved.
listeners:
  mqtt:
    enabled: false
    port: 1883
  mqtts:
    enabled: true
    port: 8883
  # MQTT over WebSocket, without and with TLS.
  ws:
    enabled: false
    port: 8080
  wss:
    enabled: false
    port: 8081

auth:
  # Mosquitto allow_anonymous for every client listener.
  allowAnonymous: false
  # Secret with Mosquitto-format files under the keys password_file and acl_file.
  existingSecret: ""
  passwordFile: true
  aclFile: true

mqttTLS:
  # kubernetes.io/tls Secret (tls.crt, tls.key) for the clients' hostname.
  # Required by mqtts and wss. A renewed certificate is loaded without a restart.
  existingSecret: ""

service:
  type: ClusterIP
  loadBalancerClass: ""
  annotations: {}

resources: {}
