{{- $listeners := include "mqextended.listeners" . | fromJsonArray -}}
{{- $auth := .Values.auth -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "mqextended.selectorLabels" . | nindent 4 }}
data:
  readiness.acl: |
    topic read /api/v1/mqx/ready
  start.sh: |
    set -eu
    umask 077
    trap 'exit 0' INT TERM

    peer() {
      id=$1
      host="$2.$POD_NAMESPACE.svc"
      # Use the pod's DNS search list for the cluster domain. Resolve regular
      # IPv4 Services, never Pod IPs or headless endpoints: Raft persists them.
      echo "Resolving Raft voter $id at $host" >&2
      while :; do
        addr=$(getent ahostsv4 "$host" | awk '$2 == "STREAM" { print $1; exit }')
        if [ -n "$addr" ]; then
          printf 'cluster_peer %s %s:7000\n' "$id" "$addr"
          return
        fi
        sleep 2
      done
    }

    config=/run/mqextended/mosquitto.conf
    {
      cat <<EOF
    per_listener_settings true
    log_dest stdout
    {{- if .Values.setTcpNoDelay }}
    set_tcp_nodelay true
    {{- end }}
    EOF
      {{- range $listeners }}
      cat <<EOF

    listener {{ int .port }} $MQX_MQTT_BIND
    protocol {{ .protocol }}
    listener_allow_anonymous {{ $auth.allowAnonymous }}
    {{- if $auth.passwordFile }}
    password_file /etc/mqextended/auth/password_file
    {{- end }}
    {{- if $auth.aclFile }}
    acl_file /etc/mqextended/auth/acl_file
    {{- end }}
    {{- if .tls }}
    certfile /etc/mqextended/mqtt/tls.crt
    keyfile /etc/mqextended/mqtt/tls.key
    {{- end }}
    EOF
      {{- end }}
      cat <<EOF

    listener 9883 127.0.0.1
    protocol http_api
    listener_allow_anonymous true
    acl_file /etc/mqextended/bootstrap/readiness.acl

    cluster_node_id $MQX_NODE_ID
    cluster_bind 0.0.0.0:7000
    cluster_data_dir /var/lib/mqextended/raft
    {{- if .Values.storage.directIO }}
    cluster_wal_direct_io true
    {{- end }}
    cluster_cafile /etc/mqextended/peer/ca.crt
    cluster_certfile /etc/mqextended/peer/tls.crt
    cluster_keyfile /etc/mqextended/peer/tls.key
    {{- if include "mqextended.autoRecoverEnabled" . }}
    auto_recover true
    {{- end }}
    {{- if (.Values.qos1ReplayBatch).enabled }}
    cluster_qos1_replay_batch true
    {{- end }}
    EOF
      {{- $voters := include "mqextended.voterCount" . | int }}
      {{- range $id := untilStep 1 (int (add1 $voters)) 1 }}
      peer {{ $id }} {{ include "mqextended.voterName" (list $.Release.Name $id) | quote }}
      {{- end }}
    } > "$config"
    {{- if include "mqextended.clientTLS" . }}

    # Kubernetes replaces the files of a Secret volume in place when the
    # certificate is renewed. Like Mosquitto, the broker reloads listener
    # certificates on SIGHUP. This process is a child of the broker, which
    # keeps this shell's PID after exec.
    tls_digest() { cat /etc/mqextended/mqtt/tls.crt /etc/mqextended/mqtt/tls.key | cksum; }
    broker=$$
    last=$(tls_digest)
    (
      trap - INT TERM
      while sleep 10; do
        now=$(tls_digest) || continue
        if [ "$now" != "$last" ]; then
          echo "Client listener certificate changed; reloading" >&2
          kill -HUP "$broker" || exit 0
          last=$now
        fi
      done
    ) &
    {{- end }}
    exec mqextended -c "$config"
