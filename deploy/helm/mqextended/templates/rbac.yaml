{{- if .Values.rollout.automatic }}
{{- $ids := untilStep 1 (int (add1 (include "mqextended.voterCount" . | int))) 1 }}
{{- range $id := $ids }}
{{- $name := include "mqextended.voterName" (list $.Release.Name $id) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mqextended.selectorLabels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mqextended.selectorLabels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
    resourceNames:
      {{- range $peer := $ids }}
      - {{ include "mqextended.voterName" (list $.Release.Name $peer) }}
      {{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames:
      {{- range $peer := $ids }}
      - {{ include "mqextended.voterName" (list $.Release.Name $peer) }}-0
      {{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
    resourceNames: [{{ printf "%s-0" $name | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mqextended.selectorLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
