[package]
name = "mqx-cluster"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = { workspace = true, features = ["serde"] }
futures-util = "0.3"
openraft = { version = "=0.10.1", default-features = false, features = ["serde", "tokio-rt", "type-alias"] }
raft-log = "0.4.7"
rmp-serde = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.27.0"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing.workspace = true
x509-parser = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14.10"
