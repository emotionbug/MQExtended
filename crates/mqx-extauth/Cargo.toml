[package]
name = "mqx-extauth"
description = "Native implementations of third-party Mosquitto auth plugins"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mqx-auth.workspace = true
mqx-topic.workspace = true
argon2 = "0.5"
base64 = "0.23.1"
bcrypt = "0.17.1"
bytes.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1"
getrandom = "0.4"
hmac = "0.13.0"
http-body-util = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-native"] }
mongodb = { version = "3.10.2", default-features = false, features = ["compat-3-0-0", "dns-resolver", "openssl-tls", "cert-key-password"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls", "client_ed25519", "client_parsec"] }
openssl = "0.10.82"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
percent-encoding = "2"
pgwire = { version = "0.42.3", default-features = false, features = ["client-api-ring", "server-api"] }
prost = "0.14"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = "1"
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-openssl = "0.6.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower-service = "0.3"
tracing.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3.27"
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
