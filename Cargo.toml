[workspace]
resolver = "3"
members = ["crates/mqx-topic", "crates/mqx-codec", "crates/mqx-auth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/emotionbug/MQExtended"
publish = false

[workspace.dependencies]
mqx-topic = { path = "crates/mqx-topic" }

bytes = "1.12"
thiserror = "2.0"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
